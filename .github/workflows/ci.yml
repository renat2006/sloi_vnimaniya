name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Сайт и сервер
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Синтаксис JS
        run: |
          for f in server.js sw.js js/*.js ci/*.mjs; do
            node --check "$f" && echo "ok $f"
          done
      - name: Смоук-тест сервера
        run: node ci/smoke-web.mjs

  android:
    name: Android (debug-сборка)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Зависимости и синхронизация Capacitor
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android
      - name: Сборка
        working-directory: android-app/android
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sloi-android-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
